# Production gate: run the full Playwright suite, publish to GitHub Pages only if it passes,
# then smoke-test the live URL. Requires Settings > Pages > Source = "GitHub Actions".
name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

  deploy:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.pages.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Publish only the site files, not tests or docs.
      - name: Collect site files
        run: |
          mkdir _site
          cp -R index.html asbo.css asbo.js asbo-intents.js services.css services.js services.json assets classic _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: pages
        uses: actions/deploy-pages@v4

  live-smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      # Test the address Pages reports (the custom domain, http or https as configured).
      - name: Smoke tests against the live site
        run: npm run test:live
        env:
          CI: true
          BASE_URL: ${{ needs.deploy.outputs.page_url }}
      - name: Record release
        if: always()
        run: echo "Released commit ${GITHUB_SHA} to ${{ needs.deploy.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
